[project]
name = "optimizer"
version = "2.0.0"
description = "知识引导多目标贝叶斯优化系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 核心依赖
    "numpy>=1.20.0",
    "pandas>=2.3.0",
    "matplotlib>=3.10.3",
    "openpyxl>=3.1.5",
    
    # 贝叶斯优化依赖
    "torch>=1.8.0",
    "botorch>=0.6.0",
    "gpytorch>=1.6.0",
    
    # LLM依赖
    "openai==1.99.6",
    "openai-agents==0.2.8",
    
    # 文献检索模块依赖
    "scp>=0.15.0",
    "aiohttp>=3.12.15",
    "aiofiles>=24.1.0",
    "mcp>=1.12.3",
    "docker>=7.1.0",
    "prompt-toolkit>=3.0.0",  # 注意：PyPI 包名是 prompt-toolkit，但导入时使用 prompt_toolkit
    "colorama>=0.4.0",
    "colorlog>=6.9.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.24",
    "tiktoken>=0.9.0",
    "rich>=14.1.0",
    "toml>=0.10.2",
    "openinference-instrumentation-openai>=0.1.30",
    "openinference-instrumentation-openai-agents>=1.1.1",
    "arize-phoenix-client>=1.14.1",
    "arize-phoenix-otel>=0.11.0",
    "arxiv>=2.2.0",
    "google-genai>=1.26.0",
    "pymupdf>=1.26.3",
    "reportlab>=4.0.0",
    "paramiko>=4.0.0",
    
    # 外部评估器依赖
    "requests>=2.25.0",
    
    # PDF处理依赖
    "PyPDF2>=3.0.0",
    
    # 网页解析依赖
    "beautifulsoup4>=4.14.0",
    "lxml>=4.9.0",
    
    # 异步和重试工具
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    
    # 科学计算依赖
    "scipy>=1.16.3",
    
    # 数据库和ORM依赖
    "sqlalchemy>=2.0.44",
    
    # MCP工具依赖
    "fastmcp>=2.12.4",
    
    # 文档解析依赖
    "chunkr-ai==0.1.0a12",
    
    # 化学工具依赖
    "rdkit>=2025.9.1",
    
    # scientific_deepresearch 额外依赖
    "art>=6.5",
    "awscli>=1.42.76",
    "e2b-code-interpreter>=2.1.1",
    "gradio-client>=1.12.1",
    "ipython>=9.4.0",
    "plotly>=6.3.1",
    "psycopg2-binary>=2.9.10",
    "pubchempy>=1.0.5",
    "pymysql>=1.1.2",
    "setuptools>=75.0.0",
    "socksio>=1.0.0",
    "selenium>=4.0.0",
    "undetected-chromedriver>=3.5.0",
    "wikipedia-api>=0.8.1",
    "boto3>=1.40.74",
    "arize-phoenix>=12.15.1",
    "paper-search-mcp>=0.1.3",
    "pexpect>=4.9.0",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "datasets>=4.0.0",
    "gpt-oss>=0.0.0",
    "gradio>=5.42.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.0",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.8",
    "tornado>=6.5.2",
]

documents = [
    "pymupdf>=1.26.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "knowledge",
    "optimization",
    "analysis",
    "utils",
    "agents",
]

[tool.uv]
index-url = "https://pypi.org/simple"
# extra-index-url = [
#     "https://mirrors.tencent.com/repository/pypi/tencent_pypi/simple",
# ]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "**/*.pyi",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
isort = { combine-as-imports = true }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = [
    "-v", "-s",
]
markers = [
    "integration: marks tests as integration tests (require real API calls, network, etc.)",
]