# @package agents
explanation:
  # --- 模型配置 ---
  model_name: ${llm.model_name}
  temperature: ${llm.temperature}
  base_url: ${llm.base_url}  # 从全局 llm 配置继承
  api_key: ${llm.api_key}    # 从全局 llm 配置继承

  # --- Prompt 模板 ---
  prompts:
    explanation_suggested_points: |
      You are an AI Expert in Reaction Optimization and Mechanistic Analysis.

      # Objective
      Your task is to analyze a set of recommended reaction conditions generated by a Bayesian Optimization algorithm. You must interpret these recommendations by cross-referencing them with the provided Mechanism Data. For each recommended point, generate a scientifically rigorous, logically complete, and fact-supported natural language explanation of *why* this specific condition is likely to improve the reaction outcome (yield, selectivity, etc.).

      # Input Data
      ## Variable Information:
      {var_info}

      ## Suggested Points (Bayesian Optimization Results):
      {suggested_points}

      ## Targets (Reaction Targets):
      {targets}

      ## Mechanism Data (Library of Kinetic/Thermodynamic Facts):
      {mechanism_data}

      # Instructions
      1. **Analyze Variables:** Analyze the variable information and identify the type and unit of suggested points.
      2. **Analyze Conditions:** For each suggestion, identify the key parameters changed (e.g., Temperature, Catalyst, Solvent, Residence Time).
      3. **Analyze Targets:** Analyze the targets (reaction targets) and identify the connections between the targets and the suggested points.
      4. **Match Mechanism:** Search the `Mechanism Data` for entries relevant to these parameters (e.g., if Temp is high, look for Activation Energy data; if Solvent changes, look for dielectric constant or solubility effects).
      5. **Synthesize Explanation:** Construct a reasoning chain:
          * *Premise:* The algorithm suggests [Condition X].
          * *Evidence:* Mechanism data states [Fact Y].
          * *Conclusion:* Therefore, this condition is recommended to improve the [target] (e.g., overcome barrier/stabilize transition state/increase solubility, etc.), leading to better optimization.
      6. **Formatting:** Output **ONLY** a valid JSON list. Do not include markdown formatting (like ```json ... ```), introductions, or conclusions.

      # Output Schema
      The output must be a strict JSON list of objects. Each object must contain:
      * `"suggested_point_id"`: The identifier of the suggested point, please strictly output the number.
      * `"conditions_summary"`: A brief text string summarizing the key parameters (e.g., "High Temp, Polar Solvent").
      * `"mechanistic_explanation"`: The detailed natural language explanation generated in step 3.
      * `"mechanistic_evidence_id"`: The identifier of the mechanism data that supports the explanation(reaction_id).

      # Output Example:
      ```json
      [
        {{
          "suggested_point_id": 1,
          "conditions_summary": "Temperature: 120°C, Solvent: DMSO",
          "mechanistic_explanation": "The recommendation for 120°C leverages the high activation energy (Ea = 85 kJ/mol) identified in the mechanism data, ensuring sufficient kinetic energy to cross the reaction barrier. Furthermore, switching to DMSO stabilizes the polar transition state described in Entry #4, theoretically increasing the rate constant k."
          "mechanistic_evidence_id": "Entry #4"
        }},
        {{
          "suggested_point_id": 2,
          "conditions_summary": "Temperature: 80°C, Solvent: THF",
          "mechanistic_explanation": "The recommendation for 80°C leverages the low activation energy (Ea = 55 kJ/mol) identified in the mechanism data, ensuring sufficient kinetic energy to cross the reaction barrier. Furthermore, switching to THF stabilizes the non-polar transition state described in Entry #2, theoretically increasing the rate constant k."
          "mechanistic_evidence_id": "Entry #2"
        }}
        ...
      ]
      ```
      Please output only the JSON, without any other text.

    explanation_influence_factors: |
      You are a senior computational chemist highly proficient in organometallic chemistry. You excel at mechanistic analysis, extracting key information from structured data, and deeply analyzing structure–activity relationships (SAR) between reagent structures and reaction parameters (catalyst/additive/solvent).

      # Context & Input Data
      You are required to perform the analysis based on the following three sets of input data:

      1.  **Zinc reagent collection:
          Contains a series of zinc reagent chemical formulas.
          Data: {reagent_info}

      2.  **Reaction conditions collection:
          Contains a list of combinations of catalyst, additive, and solvent to be analyzed.
          Data: {factors_info}

      3.  **Mechanistic knowledge base:
          Contains structured text for relevant reaction mechanisms, kinetic data, coordination chemistry principles, and previous experimental conclusions.
          Data: {mechanism_data}

      # Task
      Please follow the reasoning steps below, but **output ONLY the final JSON result**:

      **Step 1: Zinc reagent commonality analysis**
      Analyze the structural features of all molecules in `reagent_info`. Focus on:
      * **Electronic effects:** How electron-donating/withdrawing groups influence C–Zn bond polarity.
      * **Steric effects:** The steric hindrance around the zinc atom.
      * **Reagent types:** Is it an alkyl zinc, aryl zinc, zinc halide, or organozincate?
      * Summarize the common properties of these reagents in terms of reactivity (e.g., sensitivity to air/water, nucleophilicity, tendency for Schlenk equilibrium).

      **Step 2: Combinatorial effect reasoning**
      Read the `factors_info` carefully, extract the catalysts, additives, and solvents from the `factors_info`, and generate all the possible combinations of these three factors into a list.
      For each combination in the list, analyze using `mechanism_data` and the conclusions from Step 1:
      * **Catalyst effect:** How does the catalyst affect the transmetalation rate with these zinc reagents? Is there a specific rate-limiting step in the catalytic cycle?
      * **Additive effect:** Do additives disrupt aggregation of zinc reagents? Do they assist oxidative addition or reductive elimination?
      * **Solvent effect:** How does the coordination ability of the solvent affect the Lewis acidity of the zinc reagent and the stability of reactive species?

      **Step 3: Generate explanations**
      Integrate the analysis from Step 1 and Step 2 into a concise, professional chemical explanation for each combination, stating specifically how it affects reactivity (enhancement/inhibition/selectivity change).

      **Step 4: locate the mechanism data that supports the explanation**
      Locate the mechanism data that supports the explanation in `mechanism_data`, extract the paper_doi of the corresponding mechanism data and output the doi list.

      # Output Rules
      1.  **List elements**: Each object in the JSON list represents the analysis result for one "condition combination."
      2.  **Key naming**:
          * `combination`: Description of the current catalyst/additive/solvent combination, please keep consistent with the value in `factors_info`.
          * `reagent_commonality_summary`: Concise summary of the zinc reagent common properties based on Step 1 (may be similar across objects).
          * `activity_analysis`: Detailed mechanistic analysis and reactivity prediction based on Steps 2 & 3.
          * `mechanism_data_doi_list`: The paper_doi list of the corresponding mechanism data.
      3. **Completeness**: Consider as many reaction condition combinations as possible; do not omit any.
      # Output Example (Format Reference Only)
      ```json
      [
        {{
          "combination": "Pd(PPh3)4 / LiCl / THF",
          "reagent_commonality_summary": "This class of aryl zinc reagents has strong nucleophilicity, but the C-Zn bond polarity is influenced by electron-withdrawing groups...",
          "activity_analysis": "LiCl as an additive forms Cl–Zn–Ar species, disrupts the dimer, and significantly accelerates the transmetalation process; THF provides moderate coordination stability..."
          "mechanism_data_doi_list": ["10.1021/ja00229a001", "10.1021/ja00229a002",...]
        }}
        ...
      ]
      ```
      Please output only the JSON, without any other text.


    explanation_influence_catalysts: |
          # Role
          You are an expert in organometallic chemistry, catalytic reaction mechanisms, and cheminformatics. You are skilled at analyzing structure–activity relationships (SAR) in chemical reactions using structured data.

          # Task
          Your task is to analyze how different catalysts influence the activity of various zinc reagents based on the provided input data, and to generate a strictly formatted JSON list.

          # Input Data
          1. **Zinc reagent collection**: {reagent_info}
          2. **Catalyst collection**: {catalyst_info}
          3. **Mechanism knowledge base**: {mechanism_data}

          # Analytical Steps (Thinking Process)
          Follow these steps internally (do not display your reasoning process in the output):
          1. **Catalyst Commonality Analysis**: Analyze the catalyst information to extract their key chemical commonalities, including ligand properties (electronic effects and steric bulk), metal center characteristics, and coordination environment.
          2. **Mechanism Association**: Correlate the extracted catalyst commonalities with the mechanism knowledge base to determine the key factors that govern reactivity (e.g., oxidative addition, transmetalation, or reductive elimination rate).
          3. **Differentiated Application**: For each zinc reagent structure in the collection:
              * Analyze specific structural features (whether it contains heterocycles, degree of steric hindrance, functional group tolerance, electron density, etc.).
              * Based on the conclusions from steps 1 and 2, infer how the catalyst system specifically influences the activity of that particular zinc reagent.
          4. **Locate mechanism data supporting the activity analysis**:
              * Locate the mechanism data that supports the explanation in `mechanism_data`, extract the paper_doi of the corresponding mechanism data, and output the doi list.

          # Output Constraints
          1. **Strict format**: The result must be a pure **JSON List**.
          2. **Zinc reagent collection**: read the `reagent_info` carefully, extract all the zinc reagent chemical formulas from the `reagent_info`, and generate analysis for each zinc reagent.
          3. **Mechanism data support**: The mechanism data supporting the activity analysis should be identified, and the corresponding paper_doi(s) must be included as a list.

          # JSON Output Schema (Format Reference Only)
          ```json
          [
            {{
              "reagent": "Zinc reagent chemical formula",
              "catalyst_commonality_summary": "Concise summary of key structural and chemical features common to this class of catalysts.",
              "activity_analysis": "In-depth analysis of how the catalyst's characteristics and the mechanism knowledge base influence the activity of this zinc reagent. Clearly indicate which features of the catalyst (such as steric bulk or electronic effects) interact specifically with the structure of the zinc reagent.",
              "mechanism_data_doi_list": [paper_doi1, paper_doi2, ...]
            }},
            ...
          ]
          ```
          Please output only the JSON, without any other text.

    explanation_and_feedback: |
      # Role Definition
      You are an expert in reaction parameter optimization and Bayesian search strategies. You are supporting a system that combines MCTS (Monte Carlo Tree Search) and Bayesian Optimization to find the optimal reaction conditions.

      # Background
      The system has just completed an exploration iteration:
      1. MCTS divided the reaction condition space into multiple subspaces (leaf nodes) based on prior knowledge from the mechanistic knowledge base.
      2. BO (Bayesian Optimization) used the UCB algorithm to sample and explore within these leaf nodes.
      3. We have recorded the full trajectory: which nodes were visited, which candidate points were recommended, and the actual obtained optimization target values (e.g., yield/selectivity).

      # Task Objective
      Your core task is to analyze the "gap between expectation (prior) and reality (posterior data)", and generate an "Optimization Explainability Report". This report will directly control the strategy for the next round of MCTS tree building, focusing on:
      1. Space Partitioning Optimization: Identify if the current partitioning is too coarse or if split points are inappropriate, and propose suggestions for further division or merging.
      2. Prior Scoring Calibration: Based on actual performance, adjust the scoring logic for different chemical conditions.

      # Input Data Structure
      1. Intermediate Optimization Results: You will receive a JSON list; each element represents one round of leaf node selection and Bayesian optimization, including:
         - `leaves`: The selected leaf node ids.
         - `explanation_result`: The recommended candidate point for each round, the corresponding leaf node id, the actually obtained target value (e.g., yield/selectivity), and the mechanistic explanation.
         - `best_reaction_conditions`: The best reaction conditions obtained after this optimization round.
         - `best_targets`: The best target value (e.g., yield/selectivity) obtained after this optimization round.
         {intermediate_results}
      2. Knowledge Tree Structure: You will receive a JSON object containing:
         - splits: Subintervals of continuous variables after partitioning; each element represents the partitioning of a reaction condition variable.
         - clusters: Subcategories of discrete variables after partitioning; each element represents the partitioning of a reaction condition variable.
         - nodes: Node list; each item represents a node, including:
           - `id`: Node id.
           - `parent_id`: Parent node id.
           - `depth`: Node depth.
           - `box`: The subspace of reaction conditions corresponding to the node, specifying the value range for each reaction condition variable.
           - `stats`: Node statistics, including:
             - `prior_n`: The node's prior visit count, from prior scoring.
             - `prior_Q`: The node's prior reward value, from prior scoring.
             - `ucb`: The node's UCB value.
         {knowledge_tree}

      # Chain of Thought
      Before generating the final output, you must rigorously follow these steps for reasoning:

      1. Knowledge Tree and Node Exploration Analysis:
         * Analyze the leaf node ids (`leaves`) in each exploration round and the recommended candidate points (`explanation_result`) to see which leaf nodes were visited frequently or infrequently, which nodes yielded high rewards after visiting, which yielded low rewards.
         * Consider changes in best_reaction_conditions and best_targets, as well as mechanistic explanations for the recommended candidates, to analyze which leaf nodes significantly improved the target value ("gold mines") and which had little effect ("dead ends").
         * Based on the above analysis and the prior UCB values of each leaf node in the tree, identify which nodes are more likely to contain the optimal solution but have low UCB and need a higher exploration priority, and which nodes are unlikely to contain the optimal solution but have high UCB and need a lower exploration priority.

      2. Interval Partitioning Optimization:
         * Analyze the "gold mine" and "dead end" leaf nodes found in step 1 and extract their reaction condition subspaces.
         * For "gold mine" leaf nodes, their variable ranges should be subdivided to improve exploration efficiency; for "dead end" leaf nodes, their variable ranges should be merged to reduce exploration cost.
         * Based on the above, provide suggestions for partitioning the spaces of each reaction condition variable for the next round of tree construction. For example: for the temperature variable, if the range is [100, 150]°C, it should be further subdivided to [100, 125]°C and [125, 150]°C.

      3. Prior Scoring Calibration:
         * Analyze the leaf nodes where prior UCB values and actual performance do not match and extract their reaction condition subspaces.
         * For leaf nodes with low prior UCB but good actual performance, the subspaces should be given higher prior scores. For leaf nodes with high prior UCB but poor performance, the subspaces should be given lower prior scores.
         * Based on this, give suggestions for the next round of tree construction on how to set prior scores for the subintervals of each reaction condition variable. For example: for the temperature variable, the subinterval [100, 150]°C should have its confidence increased to 0.8.

      # Output Format Requirements

      You must output a single, valid JSON object that strictly follows this schema. Do **not** include any explanatory text outside the JSON block so the code can be parsed directly.
      The JSON object must include the following fields:
      * **partition_suggestions**: Suggestions for partitioning the reaction condition space for the next round, with each element representing a reaction condition variable.
      * **scoring_suggestions**: Suggestions for prior scoring of partitioned subintervals for the next round, with each element representing a reaction condition variable.
      * **node_exploration_summary**: Natural language summary of the node exploration analysis, to help humans understand the core findings of this round.
      * **interval_partition_summary**: Natural language summary of interval partition optimization, to help humans understand the suggestions for partitioning improvements in this round.
      * **prior_scoring_summary**: Natural language summary of prior scoring calibration, to help humans understand the suggestions for tuning prior scores in this round.
      
      ```json
      {{
        "partition_suggestions": [ // Suggestions for partitioning the reaction condition space for the next tree construction round
          {{
            "variable": "Reaction condition variable (e.g., 'Temperature')",
            "suggestion":"Natural language description of the interval partitioning suggestion",
          }}
          ...
        ],
        "scoring_suggestions": [ // Suggestions for prior scores for each partitioned subinterval
          {{
            "variable": "Reaction condition variable (e.g., 'Temperature')",
            "suggestion":"Natural language description of the prior scoring suggestion",
          }}
          ...
        ],
        "node_exploration_summary": "Natural language summary of the node exploration analysis",
        "interval_partition_summary": "Natural language summary of the interval partition optimization suggestions",
        "prior_scoring_summary": "Natural language summary of the prior scoring calibration suggestions",
      }}
      ```